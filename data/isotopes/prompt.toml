# Settings for this prompt. The folder name ("isotopes") is its id.
# From the ready-to-pick list (DECISIONS.md, 43). Built, cleaned up and put in
# the bank on 20 November 2026. Field reference: README.md, "Prompt settings".

text = "Name an isotope"
label = "Isotopes"
status = "ready"
subject = "physics"
audience = "school"
colour = "#556B8D"

# Players type "carbon-14" or "carbon 14": both match the article title.
category = "Category:Isotopes"
category_depth = 1
skip_categories = ["lists", "people", "tables"]
# "Isotopes of carbon" and the like are overviews, not an isotope.
# Every isotope counts (a closed set, so all are in), and nothing else: the
# last pattern drops any title that isn't an element-number name like
# "Uranium-235" or "Technetium-99m" (or deuterium, tritium, protium), which
# clears out the topic pages (radiocarbon dating, island of stability).
drop_title_patterns = ['^Isotopes of ', '^Table of ', '^(?!(?:[A-Z][a-z]*-\d+(?:m\d?)?|Deuterium|Tritium|Protium)$)']
min_views = 0
kind = "isotope"
