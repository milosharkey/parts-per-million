# Settings for this prompt. The folder name ("gemstones") is its id.
# A draft from the ready-to-pick list (DECISIONS.md, 43): probe it, build it,
# review it, then set status = "ready". Field reference: README.md, "Prompt settings".

text = "Name a gemstone"
label = "Gemstones"
status = "draft"
subject = "earth science"
audience = "everyone"
# Family: prompts too alike to play together. One per game, and not on two
# days running (deal.js, schedule.py). Minerals and gemstones share most answers.
family = "minerals"
colour = "#00838F"

# Diamond itself is an extra because its subcategory is skipped (it's full of named stones).
category = "Category:Gemstones"
category_depth = 1
# Individual famous stones (the Hope Diamond) aren't a kind of gemstone.
# Gemologists are people, gemology and hardstone carving are mostly terms,
# objects and institutions, and the Diamond and Jade categories are mostly
# famous pieces and museums. Diamond, jade, jadeite and nephrite are extras.
skip_categories = ["Individual", "Diamond", "mines", "companies", "people", "lists", "jewellery", "jewelry", "gemologists", "gemology", "hardstone carving", "in culture", "jade"]
min_views = 0
kind = "gemstone"
