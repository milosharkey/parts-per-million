# Settings for this prompt. The folder name ("sugars") is its id.
# From the ready-to-pick list (DECISIONS.md, 43). Built, cleaned up and put in
# the bank on 20 November 2026. Field reference: README.md, "Prompt settings".

text = "Name a sugar"
label = "Sugars"
status = "ready"
subject = "biochemistry"
audience = "school"
colour = "#A0522D"

# Monosaccharides and disaccharides with their subcategories (hexoses, pentoses...).
category = ["Category:Monosaccharides", "Category:Disaccharides"]
category_depth = 1
# Category:Lactose is about the sugar's world (intolerance, lactase, infant
# formula): lactose itself is in Category:Disaccharides.
skip_categories = ["lists", "people", "derivatives", "lactose"]
# Only substances: answers need a chemical formula (P274), SMILES (P233), CAS
# number (P231) or PubChem id (P662) on Wikidata. That drops the processes,
# diseases, people and products the categories also hold (DECISIONS.md, 44).
require_properties = ["P274", "P233", "P231", "P662"]
min_views = 0
# A steeper curve than the default (config.py, TARGET_TOP_SHARE = 0.15): a
# short or flat list where glucose, sucrose and fructose take most answers.
# A guess for playtests to check (DECISIONS.md, 46).
target_top_share = 0.25
kind = "sugar"
