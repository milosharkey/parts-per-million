# Settings for this prompt. The folder name ("alloys") is its id.
# From the ready-to-pick list (DECISIONS.md, 43). Built, cleaned up and put in
# the bank on 20 November 2026. Field reference: README.md, "Prompt settings".

text = "Name an alloy"
label = "Alloys"
status = "ready"
subject = "chemistry"
audience = "everyone"
colour = "#2E7D5B"

# Subcategories by base metal (copper alloys, steels...) carry most of the answers.
category = "Category:Alloys"
category_depth = 1
# "refractory metals" and "coinage metals" hold pure metals (gold, tungsten),
# which aren't alloys.
skip_categories = ["companies", "manufacturers", "people", "lists", "objects", "coins", "refractory metals", "coinage metals", "testing"]
min_views = 0
kind = "alloy"
