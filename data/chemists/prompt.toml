# Settings for this prompt. The folder name ("chemists") is its id.
# A draft from the ready-to-pick list (DECISIONS.md, 43): probe it, build it,
# review it, then set status = "ready". Field reference: README.md, "Prompt settings".

text = "Name a famous chemist"
label = "Chemists"
status = "draft"
subject = "history of science"
audience = "school"
# Family: prompts too alike to play together. One per game, and not on two
# days running (deal.js, schedule.py). Chemists and Nobel laureates overlap.
family = "chemists"
colour = "#8C5A3C"

# From Wikidata: anyone whose occupation is chemist (Q593644). Overlaps the Nobel
# prompt on purpose: this one reaches back to Boyle, Lavoisier and Dalton.
query = "chemists.rq"
# Only chemists with articles in 20+ languages: tens of thousands of chemists
# are on Wikidata, and this keeps the ones players could know.
min_sitelinks = 20
surnames = true             # "Mendeleev" counts for Dmitri Mendeleev
min_views = 0
# A steeper curve than the default (config.py, TARGET_TOP_SHARE = 0.15): a
# short or flat list where a handful of household names take most answers.
# A guess for playtests to check (DECISIONS.md, 46).
target_top_share = 0.25
kind = "person"
