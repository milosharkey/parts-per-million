# Settings for this prompt. The folder name ("hormones") is its id.
# From the ready-to-pick list (DECISIONS.md, 43). Built, cleaned up and put in
# the bank on 20 November 2026. Field reference: README.md, "Prompt settings".

text = "Name a hormone"
label = "Hormones"
status = "ready"
subject = "biology"
audience = "school"
colour = "#2D6A4F"

# Medicines that are also hormones bring patient page views (insulin, testosterone);
# a view_discounts table like the compounds prompt's may be needed after playtests.
# Category:Hormones itself is mostly about hormones (endocrinology, receptors,
# symptoms), so the hormones come from the subcategories by type too, plants
# included. extras.csv makes sure of the big ones (DECISIONS.md, 44).
category = ["Category:Hormones", "Category:Peptide hormones", "Category:Steroid hormones", "Category:Plant hormones"]
category_depth = 1
# "oxytocin" and "corticotropin" skip two categories about one hormone's
# drugs and receptors (the hormones themselves are extras).
skip_categories = ["receptors", "disorders", "antagonists", "agonists", "lists", "people", "medications", "drugs", "hormonal agents", "oxytocin", "corticotropin"]
# Only substances: a chemical formula, SMILES, CAS number, PubChem id or, for
# protein hormones, a UniProt id (P352) on Wikidata (DECISIONS.md, 44).
require_properties = ["P274", "P233", "P231", "P662", "P352"]
min_views = 0
kind = "hormone"
