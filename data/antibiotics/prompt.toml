# Settings for this prompt. The folder name ("antibiotics") is its id.
# From the ready-to-pick list (DECISIONS.md, 43). Built, cleaned up and put in
# the bank on 20 November 2026. Field reference: README.md, "Prompt settings".

text = "Name an antibiotic"
label = "Antibiotics"
status = "ready"
subject = "biology"
audience = "school"
colour = "#BF360C"

# All medicines, so page views are all patient-driven to a similar degree: no discount needed.
category = "Category:Antibiotics"
# The drug classes (penicillins, macrolides, quinolones) sit two or three
# levels down, under categories like "Cell envelope antibiotics": at depth 1
# amoxicillin and most of the must-accept list were missing.
category_depth = 3
# Phytoalexins are plants' own defences (resveratrol, allicin), and selection
# compounds are lab tools for picking out cells.
skip_categories = ["resistance", "people", "companies", "lists", "stubs", "phytoalexins", "selection", "veterinary"]
# Only substances: answers need a chemical formula (P274), SMILES (P233), CAS
# number (P231) or PubChem id (P662) on Wikidata. That drops the processes,
# diseases, people and products the categories also hold (DECISIONS.md, 44).
require_properties = ["P274", "P233", "P231", "P662"]
min_views = 0
kind = "antibiotic"
