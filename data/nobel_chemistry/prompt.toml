# Settings for this prompt. The folder name ("nobel_chemistry") is its id.
# A draft from the ready-to-pick list (DECISIONS.md, 43): probe it, build it,
# review it, then set status = "ready". Field reference: README.md, "Prompt settings".

text = "Name a winner of the Nobel Prize in Chemistry"
label = "Nobel chemists"
status = "draft"
subject = "history of science"
audience = "university"
# Family: prompts too alike to play together. One per game, and not on two
# days running (deal.js, schedule.py). Chemists and Nobel laureates overlap.
family = "chemists"
colour = "#4F5D2F"

# About 190 laureates. Surnames count on their own unless two winners share one.
category = "Category:Nobel laureates in Chemistry"
category_depth = 0
surnames = true             # "Curie" counts for Marie Curie
min_views = 0
# A steeper curve than the default (config.py, TARGET_TOP_SHARE = 0.15): a
# short or flat list where Marie Curie alone probably takes a quarter or more.
# A guess for playtests to check (DECISIONS.md, 46).
target_top_share = 0.30
kind = "person"
