# Settings for this prompt. The folder name ("acids") is its id.
# A draft from the ready-to-pick list (DECISIONS.md, 43): probe it, build it,
# review it, then set status = "ready". Field reference: README.md, "Prompt settings".

text = "Name an acid"
label = "Acids"
status = "draft"
subject = "chemistry"
audience = "everyone"
colour = "#9C3D54"

# Every acid counts (an objective definition, so all candidates are in),
# carboxylic acids included: they sit a level deeper than Category:Acids
# reaches, which is why formic and lactic acid were missing at first.
category = ["Category:Acids", "Category:Carboxylic acids"]
category_depth = 1
# Acidophiles are microbes, acid attacks are crimes, and acid catalysts and
# amphoteric compounds are mostly oxides and Lewis acids.
skip_categories = ["theory", "theories", "dissociation", "lists", "people", "salts", "esters", "derivatives", "acidophiles", "acid attacks", "catalysts", "amphoteric"]
# Only substances: answers need a chemical formula (P274), SMILES (P233), CAS
# number (P231) or PubChem id (P662) on Wikidata. That drops the processes,
# diseases, people and products the categories also hold (DECISIONS.md, 44).
require_properties = ["P274", "P233", "P231", "P662"]
min_views = 0
kind = "acid"

# Medicines are read about by patients, not players (as in aromatics).
[view_discounts]
"Template:Infobox drug" = 0.25
